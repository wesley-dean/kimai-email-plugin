---
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Versioning
permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  versioning:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version bump
        id: version-bump
        shell: bash
        run: |
          set -euo pipefail

          message="$(git log -1 --pretty=%B)"

          if grep -Eq '^(BREAKING CHANGE([[:space:]]*\(.+\))?[[:space:]]*:|[a-z]+(\(.+\))?!:)' <<<"${message}"; then
            bump="major"
          elif grep -Eq '^feat(\(.+\))?[[:space:]]*:' <<<"${message}"; then
            bump="minor"
          else
            bump="patch"
          fi

          printf 'bump=%s\n' "${bump}" >> "${GITHUB_OUTPUT}"

      - name: calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@c4e8f005e839f822325356f141939cf6c76b5701 # pin@v1
        with:
          create_tag: true
          initial_version: 0.0.1
          tag_prefix: v
          manual_bump: "${{ steps.version-bump.outputs.bump }}"

      - name: Generate release notes
        id: release-notes
        uses: RedCrafter07/release-notes-action@31674bfa3a219e7c661fc0c5b7b3851c741b9965 # pin@v1.0.1
        with:
          tag-name: "v${{ steps.calculate-version.outputs.version-string }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # pin@v3.0.3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "v${{ steps.calculate-version.outputs.version-string }}"
          body: "${{ steps.release-notes.outputs.release-notes }}"
          tag_name: "v${{ steps.calculate-version.outputs.version-string }}"
          draft: false
          prerelease: false
