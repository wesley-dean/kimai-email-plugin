---
name: Kimai 2.67 compatibility

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and static checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: ctype, gd, iconv, intl, mbstring, xml, zip

      - name: Install plugin development dependencies
        run: composer install --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-version

      - name: Run PHPStan
        run: composer phpstan

      - name: Run unit tests
        run: composer test-unit

  integration:
    name: Kimai 2.67 integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql@sha256:45abdd9b4144660b5c93a5b7d0ebb21e024f0ba9851ecb4ab43bf83c6bf83592
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: kimai
          MYSQL_DATABASE: kimai
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plugin

      - name: Checkout Kimai 2.67.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kimai/kimai
          ref: 2.67.0
          path: kimai
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: ctype, gd, iconv, intl, mbstring, mysql, xml, zip

      - name: Build deterministic release package
        working-directory: plugin
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            php -r '
              $data = json_decode(
                  file_get_contents("composer.json"),
                  true,
                  512,
                  JSON_THROW_ON_ERROR
              );
              echo $data["version"] ?? "";
            '
          )"

          ./scripts/build-release.bash             "${version}"             "${RUNNER_TEMP}/release-a"

          ./scripts/build-release.bash             "${version}"             "${RUNNER_TEMP}/release-b"

          cmp             "${RUNNER_TEMP}/release-a/InvoiceEmailerBundle-${version}.zip"             "${RUNNER_TEMP}/release-b/InvoiceEmailerBundle-${version}.zip"

          cmp             "${RUNNER_TEMP}/release-a/InvoiceEmailerBundle-${version}.zip.sha256"             "${RUNNER_TEMP}/release-b/InvoiceEmailerBundle-${version}.zip.sha256"

          printf 'PLUGIN_VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"

      - name: Install Kimai dependencies
        working-directory: kimai
        run: composer install --no-interaction --no-progress

      - name: Prepare Kimai 2.67 test environment
        working-directory: kimai
        run: |
          sed -i '/App\\Importer\\ImporterService:/,+2d' config/services_test.yaml
          sed -i "/^];$/i\\    KimaiPlugin\\\\InvoiceEmailerBundle\\\\InvoiceEmailerBundle::class => ['test' => true]," config/bundles.php

      - name: Install packaged plugin into Kimai
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/release-a/InvoiceEmailerBundle-${PLUGIN_VERSION}.zip"

          mkdir -p kimai/var/plugins
          unzip -q "${archive}" -d kimai/var/plugins

          test -f kimai/var/plugins/InvoiceEmailerBundle/InvoiceEmailerBundle.php
          test -f kimai/var/plugins/InvoiceEmailerBundle/LICENSE
          test -f kimai/var/plugins/InvoiceEmailerBundle/UPSTREAM.md

          test ! -e kimai/var/plugins/InvoiceEmailerBundle/tests
          test ! -e kimai/var/plugins/InvoiceEmailerBundle/doc
          test ! -e kimai/var/plugins/InvoiceEmailerBundle/.github
          test ! -e kimai/var/plugins/InvoiceEmailerBundle/scripts

      - name: Reload Kimai with plugin
        working-directory: kimai
        run: bin/console kimai:reload --env=test --no-interaction

      - name: Validate Kimai container
        working-directory: kimai
        run: bin/console lint:container --env=prod

      - name: Validate plugin YAML
        working-directory: kimai
        run: >-
          bin/console lint:yaml
          var/plugins/InvoiceEmailerBundle/Resources/config
          --parse-tags

      - name: Validate plugin Twig
        working-directory: kimai
        run: >-
          bin/console lint:twig
          var/plugins/InvoiceEmailerBundle/Resources/views
          --show-deprecations

      - name: Validate plugin translations
        working-directory: kimai
        run: >-
          bin/console lint:xliff
          var/plugins/InvoiceEmailerBundle/Resources/translations

      - name: Verify plugin routes
        working-directory: kimai
        run: |
          bin/console debug:router invoice_emailer_confirm --env=prod
          bin/console debug:router invoice_emailer_send --env=prod

      - name: Run plugin integration tests
        working-directory: kimai
        run: >-
          vendor/bin/phpunit
          ../plugin/tests/Integration
        env:
          DATABASE_URL: >-
            mysql://root:kimai@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/kimai?charset=utf8mb4&serverVersion=8.0.35
          APP_ENV: test
          APP_DEBUG: '0'
          MAILER_URL: null://localhost
          MAILER_FROM: kimai@example.com
